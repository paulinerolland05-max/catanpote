<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#7a1414">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Catan Entre nous</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;height:100dvh;font-family:"Roboto Condensed","Arial Narrow",sans-serif;font-weight:700;color:#fff}
body{background:radial-gradient(ellipse at center,transparent 55%,rgba(40,15,0,.45) 100%),repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 130px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.06) 1px 3px),linear-gradient(#c4742c,#a85a18);overflow:hidden}
#app{height:100%;height:100dvh;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:8px}
h1{margin:0;font-size:26px;text-shadow:0 2px 0 #5a0d0d}
.carte{background:#7a1414;border-radius:12px;padding:12px;box-shadow:0 4px 0 #4a0808;max-width:92vw;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:auto;text-align:center}
button,input,select{font:inherit;border-radius:8px;border:0;padding:8px 12px;margin:3px}
button{background:#f2a31b;color:#3a1600;box-shadow:0 3px 0 #a86a00}button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.35;box-shadow:none;filter:grayscale(.6)}
input,select{background:#fff;color:#222}
.grille{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pastille{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;border:2px solid #fff}
#charge{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#4a0808,#b3321f 40%,#f08a1c 70%,#fcd36b);z-index:2}
#charge svg{position:absolute;left:0;bottom:0;width:100%;height:62%}
#charge .titre{position:absolute;top:8%;width:100%;text-align:center;font-size:clamp(26px,7vw,46px);text-shadow:0 3px 0 #4a0808}
#charge .conseil{position:absolute;top:26%;left:50%;transform:translateX(-50%);width:min(520px,86vw);text-align:center;font-size:clamp(14px,3.6vw,19px);background:#4a0808bb;border-radius:12px;padding:8px 14px;text-shadow:0 1px 0 #000}
#charge .loader{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#charge .loader i{width:20px;height:23px;background:#f2a31b;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:hexp .9s ease-in-out infinite}
#charge .loader i:nth-child(2){animation-delay:.15s}#charge .loader i:nth-child(3){animation-delay:.3s}
@keyframes hexp{50%{transform:scale(.55);opacity:.5}}
.flotte{position:fixed;bottom:60px;transform:translateX(-50%);font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;z-index:15;animation:monte 1.4s ease-out forwards}
@keyframes monte{from{opacity:1;margin-bottom:0}to{opacity:0;margin-bottom:46px}}
@media(prefers-reduced-motion:reduce){.flotte{animation:none}#charge .loader i{animation:none}}
#stock{position:fixed;right:calc(4px + env(safe-area-inset-right,0px));top:70px;display:flex;flex-direction:column;gap:6px;align-items:center;background:#4a0808cc;border:2px solid #fff;border-radius:10px;padding:4px 6px;font-size:12px;z-index:4}
#stock div{display:flex;flex-direction:column;align-items:center;line-height:1.1}
#rot{display:none;position:fixed;inset:0;background:#7a1414;z-index:9;align-items:center;justify-content:center;font-size:28px}
@media(orientation:portrait){#rot{display:flex}}
#plateau{width:100%;flex:1;min-height:0}
#haut{display:flex;gap:3px;flex-wrap:nowrap;justify-content:center;width:100%;flex:none}
#haut .pj{flex:1 1 0;max-width:210px;min-width:0;font-size:10px;padding:1px 4px;line-height:1.15;overflow:hidden;white-space:nowrap}
.pj{border-radius:8px;padding:2px 7px;font-size:12px;border:2px solid #fff}
#bas{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;flex:none}
#bas .pj{padding:1px 6px}#bas button{margin:0;padding:5px 9px;font-size:13px}
#cote{position:fixed;right:calc(4px + env(safe-area-inset-right,0px));top:calc(4px + env(safe-area-inset-top,0px));max-height:calc(100% - 58px);width:min(290px,46vw);overflow:auto;z-index:6;padding:8px;font-size:13px}
#cote button,#cote select{margin:2px;padding:6px 9px}
.croix{float:right;position:sticky;top:0;z-index:3;background:#a33;color:#fff;padding:3px 10px;margin:0 0 4px 6px}
#app.jeu{justify-content:flex-start;overflow:hidden;padding:4px;gap:4px}
.cible{cursor:pointer;animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.cible{animation:none}}
</style></head><body>
<div id="rot">📱 Tournez votre téléphone</div><div id="app"></div>
<div id="menu" style="display:none;position:fixed;left:4px;top:70px;flex-direction:column;gap:4px;z-index:8"><button onclick="quitter()">🚪</button><button onclick="basculeChat()">💬<span id="nbchat"></span></button><button onclick="regles()">📖</button></div>
<div id="chat" style="display:none;position:fixed;left:calc(56px + env(safe-area-inset-left,0px));bottom:50px;width:200px;background:#7a1414f0;border-radius:10px;padding:4px;z-index:8;box-shadow:0 3px 0 #4a0808;font-size:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span>💬 Chat</span><button onclick="basculeChat()" style="margin:0;padding:1px 8px;background:#a33;color:#fff">✖</button></div><div id="msgs" style="max-height:16vh;overflow:auto;text-align:left;font-weight:400"></div><div style="display:flex;gap:2px"><input id="ci" maxlength="200" style="flex:1;min-width:0;margin:0;padding:4px 6px;font-size:12px" placeholder="Message" onkeydown="if(event.key==='Enter')envoyerChat()"><button onclick="envoyerChat()" style="margin:0;padding:3px 8px">➤</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script><script src="board.js"></script><script src="engine.js"></script><script src="avatars.js"></script>
<script>
// ===== État et Firebase =====
const C = window.CONFIG, app = document.getElementById('app');
const COULEURS = {rouge:'#d32f2f',bleu:'#1976d2',orange:'#f57c00',blanc:'#eeeeee',vert:'#388e3c',marron:'#6d4c41'};
const TUILES = {foret:'#2f6b2f',pre:'#8fc24a',champ:'#e6c34a',colline:'#c0662f',montagne:'#7d8791',desert:'#e3d199'};
const NOMS_PORT = {generique:'3:1',foret:'2:1 🌲',pre:'2:1 🐑',champ:'2:1 🌾',colline:'2:1 🧱',montagne:'2:1 ⛰'};
const appareil = localStorage.appareil || (localStorage.appareil = Math.random().toString(36).slice(2));
let db, moi = localStorage.moi || null, partieId = null, ecoute = null, monAvatar = '';
const html = (h) => { app.className = ''; app.innerHTML = h; };

try { firebase.initializeApp(C.firebase); db = firebase.database(); } catch (e) { console.error(e); }

// ===== Écran de chargement =====
const CONSEILS = ["Les 6 et 8 sortent le plus souvent : 5 chances sur 36 chacun.","Il faut au moins 5 routes à la suite pour prendre la route la plus longue.","Trois chevaliers joués suffisent pour l'armée la plus puissante.","Une carte développement achetée ne se joue pas le même tour, sauf un point de victoire.","Avec un 7, ceux qui ont plus de 7 cartes en défaussent la moitié.","On ne peut gagner que pendant son propre tour.","Deux colonies doivent toujours être séparées d'au moins une intersection libre.","Un port 2:1 est surtout utile si tu produis la ressource correspondante.","Un mouton nommé après une victoire reste dans le paquet pour toujours."];
// Écran de chargement : coucher de soleil sur les montagnes et un champ de blé, conseils qui défilent
function chargement(){
  let i = Math.floor(Math.random() * CONSEILS.length);
  html(`<div id="charge"><svg viewBox="0 0 400 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><radialGradient id="soleil"><stop offset="0" stop-color="#fff4c2"/><stop offset="1" stop-color="#ffb84a"/></radialGradient>
    <pattern id="ble" width="9" height="26" patternUnits="userSpaceOnUse"><g stroke="#8a5a0c" stroke-width="1.2" stroke-linecap="round"><line x1="4.5" y1="26" x2="4.5" y2="8"/></g><g fill="#d9a21e"><ellipse cx="4.5" cy="7" rx="2" ry="4"/><ellipse cx="1.5" cy="11" rx="1.4" ry="3" transform="rotate(-25 1.5 11)"/><ellipse cx="7.5" cy="11" rx="1.4" ry="3" transform="rotate(25 7.5 11)"/></g></pattern></defs>
    <circle cx="200" cy="120" r="46" fill="url(#soleil)"/>
    <path d="M0 150 L55 98 L105 138 L165 78 L235 142 L300 92 L355 136 L400 112 V230 H0Z" fill="#8a2020"/>
    <path d="M0 176 L80 128 L150 168 L228 122 L310 168 L400 138 V230 H0Z" fill="#561212"/>
    <path d="M0 190 Q200 170 400 190 V230 H0Z" fill="#c98a1c"/><rect x="0" y="190" width="400" height="40" fill="url(#ble)"/><rect x="0" y="212" width="400" height="18" fill="#a8700f" opacity=".55"/></svg>
    <div class="titre">Catan Entre nous</div><div class="conseil"><b>Saviez-vous que…</b><br><span id="cs">${CONSEILS[i]}</span></div><div class="loader"><i></i><i></i><i></i></div></div>`);
  const t = setInterval(() => { i = (i + 1) % CONSEILS.length; const e = document.getElementById('cs'); if (e) e.textContent = CONSEILS[i]; }, 2000);
  setTimeout(() => { clearInterval(t); accueil(); }, 3200);
}

// ===== Accueil : code du groupe =====
function accueil(){
  if (sessionStorage.ok) return profils();
  html(`<div class="carte"><h1>Code d'accès</h1><input id="c" type="password" placeholder="Code du groupe"><br><button onclick="verifier()">Entrer</button><p id="e"></p></div>`);
}
function verifier(){ if (c.value.trim() === C.CODE_GROUPE){ sessionStorage.ok = 1; profils(); } else e.textContent = "Code incorrect"; }

// ===== Choix du profil (un profil = un seul appareil) =====
async function profils(){
  const snap = await db.ref('catan/joueurs').get(), data = snap.val() || {};
  const noms = [...new Set([...C.JOUEURS, ...Object.keys(data)])].filter(n => !(data[n] && data[n].archive));
  html(`<div class="carte"><h1>Qui es-tu ?</h1><div class="grille">${noms.map(n => {
    const pris = data[n] && data[n].appareil && data[n].appareil !== appareil;
    return `<span><button ${pris?'disabled style="opacity:.4"':''} onclick="choisir('${n}')"><span style="display:inline-block;vertical-align:middle;margin-right:4px">${avatarSvg(data[n] && data[n].avatar, 22)}</span>${n}${pris?' (connecté ailleurs)':''}</button><button style="background:#a33;color:#fff;padding:8px 6px" onclick="archiver('${n}')">✖</button></span>`;}).join('')}</div>
    <p><input id="nv" placeholder="Nouveau joueur" maxlength="20"><button onclick="ajouter()">Ajouter</button></p></div>`);
}
function ajouter(){ const n = nv.value.trim(); if (n) choisir(n); }
async function choisir(n){
  const ref = db.ref('catan/joueurs/'+n+'/appareil'), s = await ref.get();
  if (s.val() && s.val() !== appareil) return profils();
  await ref.set(appareil); ref.onDisconnect().remove(); // libère le profil à la déconnexion
  moi = localStorage.moi = n; monAvatar = (await db.ref('catan/joueurs/'+n+'/avatar').get()).val() || '';
  if (!monAvatar) return choixAvatar(); salon();
}
// Choix (ou changement) du personnage : enregistré sur le profil
function choixAvatar(){
  if (ecoute) ecoute.off();
  html(`<div class="carte">${croix()}<h1>Choisis ton personnage</h1><div class="grille">${AVATARS.map(a => `<button style="width:86px;padding:6px 2px;${a.id===monAvatar?'outline:3px solid #fff':''}" onclick="setAvatar('${a.id}')"><span style="display:block;width:58px;height:58px;margin:0 auto 2px;background:#7a141477;border-radius:50%;overflow:hidden">${avatarSvg(a.id, 58)}</span>${a.nom}</button>`).join('')}</div><p><button onclick="salon()">Retour</button></p></div>`);
}
async function setAvatar(id){ monAvatar = id; await db.ref('catan/joueurs/'+moi+'/avatar').set(id); salon(); }

// ===== Salon =====
const croix = () => '<button class="croix" onclick="salon()">✖</button>';
function salon(){
  nettoyerPartie();
  if (ecoute) ecoute.off();
  ecoute = db.ref('catan/parties'); 
  ecoute.on('value', s => {
    const ps = s.val() || {}, vieux = i => ps[i].statut === 'attente' && !ps[i].places; // salles sans aucun joueur : supprimées
    Object.keys(ps).filter(vieux).forEach(i => db.ref('catan/parties/'+i).remove());
    const ids = Object.keys(ps).filter(i => ps[i].statut !== 'terminee' && !vieux(i));
    const enCours = ids.find(i => ps[i].places && ps[i].places[moi] && ps[i].statut === 'en_cours');
    if (enCours && !horsPartie) { ecoute.off(); return jouer(enCours); }
    html(`<div class="carte"><h1>Salon — ${moi}</h1><p style="margin:0;font-size:11px;opacity:.6">version 19</p>
      <div class="grille">${ids.map(i => { const en = ps[i].statut === 'en_cours', nbj = Object.keys(ps[i].places||{}).length, x = (en ? (ps[i].places || {})[moi] : ps[i].hote === moi) ? `<button style="background:#a33;color:#fff;padding:8px 6px" onclick="supprimerSalle('${i}')">✖</button>` : '';
        return en ? `<span><button disabled>🎲 Partie de ${ps[i].hote} en cours (${nbj})</button>${x}</span>` : `<span><button onclick="rejoindre('${i}')">Partie de ${ps[i].hote} (${nbj}/${ps[i].nb})</button>${x}</span>`; }).join('') || 'Aucune partie ouverte'}
      </div>
      ${enCours ? `<p><button onclick="reprendre('${enCours}')">▶ Reprendre ma partie</button><button style="background:#a33;color:#fff" onclick="fermerPartie('${enCours}')">🛑 Fermer cette partie</button></p>` : ''}<p>Nombre de joueurs <select id="nb">${[3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select>
      <button onclick="creer()">Créer une partie</button></p>
      <p><button onclick="classement()">🏆 Classement</button><button onclick="historique()">📜 Historique</button><button onclick="choixAvatar()">🎭 Mon personnage</button></p>
      <p><button onclick="stats()">📊 Statistiques</button><button onclick="reglages()">⚙️ Réglages</button></p></div>`);
    const mienne = ids.find(i => ps[i].places && ps[i].places[moi]); if (mienne && ps[mienne].statut === 'attente') attente(mienne, ps[mienne]);
  });
}
async function creer(){ // une seule salle d'attente par joueur
  const ps = (await db.ref('catan/parties').get()).val() || {};
  if (Object.keys(ps).some(i => ps[i].statut === 'attente' && ps[i].places && ps[i].places[moi])) return toast('Tu es déjà dans une partie en attente');
  db.ref('catan/parties').push({hote:moi, nb:+nb.value, statut:'attente', cree:Date.now(), places:{[moi]:{couleur:'rouge', avatar:monAvatar}}});
}
function quitterAttente(id){ db.ref(`catan/parties/${id}/places/${moi}`).remove(); } // un joueur libère sa place ; la salle reste ouverte
function supprimerSalle(id){ // l'hôte ferme sa salle d'attente ; un participant peut fermer une partie en cours (avec confirmation)
  db.ref('catan/parties/'+id+'/statut').get().then(st => {
    const en = st.val() === 'en_cours';
    if (confirm(en ? 'Cette partie est en cours. Êtes-vous sûr de vouloir la supprimer pour tous les joueurs ? Elle ne sera pas enregistrée.' : 'Êtes-vous sûr de vouloir supprimer cette salle d\'attente ?')) { db.ref('catan/parties/'+id).remove(); db.ref('catan/presence/'+id).remove(); db.ref('catan/chats/'+id).remove(); }
  });
}
function fermerPartie(id){ // ferme la partie pour tout le monde (non enregistrée)
  if (!confirm('Fermer cette partie pour tous les joueurs ? Elle ne sera pas enregistrée.')) return;
  db.ref('catan/parties/'+id).remove(); db.ref('catan/presence/'+id).remove(); db.ref('catan/chats/'+id).remove();
}
function rejoindre(i){ db.ref(`catan/parties/${i}/places/${moi}`).set({couleur:'', avatar:monAvatar}); }

// ===== Salle d'attente : couleur + lancement par l'hôte =====
function attente(id, p){
  const places = p.places, prises = Object.values(places).map(x => x.couleur), n = Object.keys(places).length;
  html(`<div class="carte"><h1>Partie de ${p.hote} — ${n}/${p.nb}</h1>
    <p>${Object.entries(places).map(([j,x]) => `<span class="pastille" style="background:${COULEURS[x.couleur]||'#555'}"></span><span style="display:inline-block;vertical-align:middle">${avatarSvg(x.avatar, 22)}</span> ${j}`).join(' · ')}</p>
    <div class="grille">${Object.keys(COULEURS).map(c => `<button ${prises.includes(c)&&places[moi].couleur!==c?'disabled':''} style="background:${COULEURS[c]};color:#000" onclick="couleur('${id}','${c}')">${c}</button>`).join('')}</div>
    ${p.hote===moi ? `<button ${n<3||n!==p.nb||prises.includes('')?'disabled':''} onclick="lancer('${id}',${p.nb})">Lancer la partie</button>` : '<p>En attente de l\'hôte…</p>'}
    ${p.hote === moi ? `<button style="background:#a33;color:#fff" onclick="supprimerSalle('${id}')">Fermer la salle</button>` : `<button onclick="quitterAttente('${id}')">Quitter</button>`}</div>`);
}
function couleur(id, c){ db.ref(`catan/parties/${id}/places/${moi}/couleur`).set(c); }
async function lancer(id, nb){ // l'hôte crée l'état de jeu ; les moutons sont tirés du paquet persistant (catan/moutons)
  const places = (await db.ref('catan/parties/'+id+'/places').get()).val(), ordre = Object.keys(places).sort(() => Math.random() - .5), pl = CatanBoard.genererPlateau(nb);
  let deck = (await db.ref('catan/moutons').get()).val();
  if (!deck) { deck = {}; for (let i = 1; i <= 24; i++) deck['m'+String(i).padStart(2,'0')] = { nom:'', date:'' }; await db.ref('catan/moutons').set(deck); }
  const etat = Moteur.creer(ordre, { hexs:pl.hexs, ports:pl.ports }, nb), ids = Object.keys(deck).sort(() => Math.random() - .5).slice(0, etat.banque.mouton), noms = {};
  ids.forEach(i => { if (deck[i].nom) noms[i] = deck[i]; }); etat.moutons = { banque:ids, mains:{}, noms }; etat.limite = maintenant() + 60000;
  db.ref('catan/parties/'+id).update({ etat, statut:'en_cours', debut:Date.now() });
}

// ===== Partie : synchronisation =====
const S = 62, RR = S/Math.sqrt(3), D6 = [[1,0],[.5,.866],[-.5,.866],[-1,0],[-.5,-.866],[.5,-.866]];
const EM = {bois:'🌲',brique:'🧱',mouton:'🐑',ble:'🌾',minerai:'⛰️'}, NDEV = {chevalier:'Chevalier',routes:'Routes',invention:'Invention',monopole:'Monopole',pv:'Pt victoire'};
let desVu, prevRes, volVu, echVu, infoCo = null, marquer = null, choix=null, G=null, P=null, pid=null, mode=null, pan=null, sel={}, decal=0, vict=null, ecouteP=null, timer=null, args=[];
db.ref('.info/serverTimeOffset').on('value', s => decal = s.val() || 0);
const maintenant = () => Date.now() + decal;
const cleTour = s => Moteur.courant(s)+'|'+(s.setup?s.setup.i:'')+'|'+(s.speciale?s.speciale.restants.length:'')+'|'+s.tour;
function annonce(m){ const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:12px;font-size:18px;z-index:20;text-align:center;box-shadow:0 4px 0 #0008;max-width:90vw'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
function animeDes(d){
  const el = document.createElement('div'); el.style.cssText = 'position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);display:flex;gap:10px;z-index:18;pointer-events:none'; let n = 0;
  const tick = () => { el.innerHTML = [0, 1].map(i => '<div style="width:54px;height:54px;border-radius:10px;background:#f3e6c0;color:#222;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0007;transform:rotate(' + Math.round(Math.random() * 30 - 15) + 'deg)">' + (n < 8 ? 1 + Math.floor(Math.random() * 6) : d[i]) + '</div>').join(''); n++; };
  tick(); document.body.appendChild(el); const t = setInterval(() => { tick(); if (n > 8) clearInterval(t); }, 80); setTimeout(() => el.remove(), 2200);
}
function flotte(txt, i){ const e = document.createElement('div'); e.className = 'flotte'; e.style.left = 'calc(50% + ' + ((i - 2) * 62) + 'px)'; e.textContent = txt; document.body.appendChild(e); setTimeout(() => e.remove(), 1500); }
function toast(m){ if(!m) return; const d=document.createElement('div'); d.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:8px;z-index:20'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2000); }
function jouer(id){
  pid = id; volVu = desVu = prevRes = echVu = undefined; horsPartie = false; if (ecouteP) ecouteP.off(); if (presRef) presRef.off();
  ecouteP = db.ref('catan/parties/'+id);
  presRef = db.ref('catan/presence/'+id); const mien = presRef.child(moi);
  marquer = () => { mien.onDisconnect().remove(); mien.set(true); }; marquer(); // présence : disparaît si l'appareil se déconnecte, et revient à la reconnexion

    pop = `<b>🃏 ${esc(moi)}, un 7 a été lancé : défaussez ${n} cartes</b><br><span style="font-size:1.1em">Choisies ${tot}/${n}${tot<n?' — encore '+(n-tot)+' à choisir':' ✔ prêt, appuie sur Valider'}</span><br>${Moteur.RES.map(r => `<button onclick="defAdd('${r}')" ${(sel[r]||0)>=p.res[r]?'disabled':''}>${EM[r]} ${sel[r]||0}/${p.res[r]}</button>`).join('')}<br>${bouton('Effacer', 'defRaz()')}<button style="${tot===n?'background:#3fa34d;color:#fff':''}" ${tot!==n?'disabled':''} onclick="A('defausser',sel);sel={}">Valider</button>`; }
  if (vict !== null) pop = `<b>Voler à qui ?</b><br>${[...new Set(Moteur.topo(G).coins[vict].map(v => G.colonies[v] && G.colonies[v].j).filter(x => x && x !== moi))].map(j => bouton(j, `A('deplacerVoleur',${vict},'${j}');vict=null`)).join('')}`;
  if (choix) pop = `<b>Poser ici ?</b><br>${bouton('✔ Confirmer', 'confirmer()')}${bouton('✖ Annuler', 'annulerChoix()')}`;
  if (ph === 'fin') pop = (G.vainqueur === moi && !P.moutonFait) ? `<h1>🏆 Bravo !</h1>Nomme ton mouton (optionnel)<br><input id="mn" maxlength="30" placeholder="Nom du mouton"><br>${bouton('Nommer', 'nommer(mn.value)')}${bouton('Passer', "nommer('')")}` : `<h1>🏆 ${esc(G.vainqueur)}</h1>${bouton('Retour au salon', 'salon()')}`;
  if (ph === 'fin' && P.statut !== 'terminee') enregistrer();
  const pc = p.pieces || { route:15, colonie:5, ville:4 }, fm = col(moi); // pièces restantes, rangées sur le côté
  const stock = `<div id="stock"><div><svg width="36" height="14"><line x1="5" y1="7" x2="31" y2="7" stroke="#000" stroke-width="11" stroke-linecap="round"/><line x1="5" y1="7" x2="31" y2="7" stroke="${fm}" stroke-width="7" stroke-linecap="round"/></svg><b>${pc.route}/15</b></div><div><svg viewBox="0 0 28 28" width="28" height="28">${maison(14, 16, fm)}</svg><b>${pc.colonie}/5</b></div><div><svg viewBox="0 0 28 30" width="28" height="30">${villeSvg(14, 20, fm)}</svg><b>${pc.ville}/4</b></div></div>`;
  const manquants = G.ordre.filter(j => PR && !PR[j] && !(G.ecartes || {})[j]), fmt = o => Object.entries(o).map(([r, n]) => n + EM[r]).join(' ');
  const chef = PR && PR[P.hote] ? P.hote : (G.ordre.find(j => PR && PR[j]) || P.hote), bandeau = G.pause ? `<div style="background:#c62828;padding:4px 10px;border-radius:8px">⏸ Partie en pause — ${manquants.map(esc).join(', ') || 'reprise…'} déconnecté(e)${chef === moi ? ' ' + manquants.map(x => bouton('Continuer sans ' + esc(x), `ecarter('${x}')`)).join('') : ''}</div>` : '';
  const aucuneRoute = t.edges.every(e => !Moteur.peutRoute(G, moi, e.id)), routesHtml = mt && G.routesGratuites > 0 ? `<div class="pj" style="background:#2e7d32">🛣 Carte Routes : pose ${G.routesGratuites} route(s) gratuite(s)${aucuneRoute ? ' — aucun emplacement possible' : ''} ${bouton('Terminer', "A('finRoutes')")}</div>` : '';
  const popPan = ['c','e','d'].includes(pan) && !choix && vict === null && ph !== 'fin' && !(ph === 'defausse' && G.aDefausser[moi]);
  const x = G.echange; let offreHtml = '';
  if (x && ph === 'principal') offreHtml = x.de === moi ? `<div class="pj" style="background:#4a0808">Votre offre : ${fmt(x.offre)} contre ${fmt(x.demande)} ${bouton('Annuler', "A('annulerEchange')")}</div>`
    : (refuses[x.ts] ? '' : `<div class="pj" style="background:#4a0808">${esc(x.de)} propose : il donne ${fmt(x.offre)} contre ${fmt(x.demande)} ${bouton('Accepter', "A('accepterEchange')")}${bouton('Refuser', `refuser(${x.ts})`)}</div>`);
  html(`<div id="haut">${haut}</div>${bandeau}<div style="font-size:13px;flex:none">${msg}</div>${consigneHtml}${routesHtml}${offreHtml}<svg id="plateau" viewBox="${vb}">${g}</svg>
    ${stock}
    ${!pop ? '' : choix ? `<div class="carte" style="position:fixed;left:50%;bottom:50px;transform:translateX(-50%);z-index:7;padding:6px 10px">${pop}</div>`
      : ph === 'fin' ? `<div class="carte" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9">${pop}</div>`
      : `<div id="cote" class="carte">${popPan ? '<button class="croix" onclick="fermePan()">✖</button>' : ''}${pop}</div>`}
    <div id="bas">${bas}</div>`); app.className = 'jeu';
}
// ===== Échange, pause, quitter, chat =====
let tO = {}, tD = {}, refuses = {}, PR = null, presRef = null, chatRef = null, vus = -1, nMsg = 0, horsPartie = false;
const tAdd = (w, r) => { const o = w === 'o' ? tO : tD; o[r] = (o[r] || 0) + 1; vue(); }, tRaz = () => { tO = {}; tD = {}; vue(); };
function proposer(){ A('proposerEchange', tO, tD); tO = {}; tD = {}; pan = null; }
const refuser = ts => { refuses[ts] = true; vue(); };
// Pause automatique si un joueur est déconnecté plus de 3 secondes ; le chrono est décalé de la durée de la pause
function verifPause(){
  if (!G || G.phase === 'fin' || !PR) return;
  const manque = () => G.ordre.some(j => !PR[j] && !(G.ecartes || {})[j]);
  if (manque() && !G.pause) setTimeout(() => { if (G && !G.pause && manque()) agir(s => { if (s.pause) return { erreur:'' }; s.pause = maintenant(); return { ok:true }; }, true); }, 3000);
  if (!manque() && !G.pause && G.limite < maintenant() - 8000) agir(s => (s.pause || s.limite >= maintenant() - 8000) ? { erreur:'' } : (s.limite = maintenant() + 60000, { ok:true }), true); // chrono périmé (tout le monde était parti) : on repart pour 1 minute
  if (!manque() && G.pause) agir(s => { if (!s.pause) return { erreur:'' }; s.limite += maintenant() - s.pause; delete s.pause; return { ok:true }; }, true);
}
// « Continuer sans lui » (hôte) : ses pièces restent, il passe ses tours
function ecarter(x){ if (confirm('Continuer sans ' + x + ' ?')) agir(s => { s.ecartes = s.ecartes || {}; s.ecartes[x] = true; return { ok:true }; }, true); }
try { document.addEventListener('visibilitychange', () => { if (!document.hidden && marquer) marquer(); }); window.addEventListener('online', () => { if (marquer) marquer(); }); } catch (e) {} // retour au premier plan / réseau retrouvé : on se déclare de nouveau présent
function nettoyerPartie(){ // quitte proprement la partie (présence, écoutes, menu, chat)
  clearInterval(timer); if (ecouteP) ecouteP.off(); if (presRef) { if (moi) presRef.child(moi).remove(); presRef.off(); } if (chatRef) chatRef.off();
  if (infoCo) infoCo.off(); infoCo = marquer = null; presRef = chatRef = ecouteP = null; G = P = PR = null;
  document.getElementById('menu').style.display = 'none'; document.getElementById('chat').style.display = 'none';
}
function quitter(){ if (confirm('Voulez-vous retourner au menu principal ?')) { horsPartie = true; salon(); } }
function reprendre(id){ horsPartie = false; if (ecoute) ecoute.off(); jouer(id); }
function regles(){ alert("Coûts\nRoute : bois + brique\nColonie : bois + brique + mouton + blé\nVille : 2 blé + 3 minerai\nCarte développement : mouton + blé + minerai\n\nVictoire à 10 points pendant votre tour.\nRoute la plus longue (5 minimum) : 2 points.\nArmée la plus puissante (3 chevaliers minimum) : 2 points.\nCommerce : 4:1 avec la banque, 3:1 ou 2:1 avec un port."); }
function chatInit(id){
  if (chatRef) chatRef.off(); vus = -1; chatRef = db.ref('catan/chats/'+id).limitToLast(50);
  chatRef.on('value', s => {
    const m = Object.values(s.val() || {}), box = document.getElementById('msgs'), ouvert = document.getElementById('chat').style.display === 'block';
    box.innerHTML = m.map(x => `<div><b>${esc(x.j)}</b> ${esc(x.t)}</div>`).join(''); box.scrollTop = box.scrollHeight; nMsg = m.length;
    if (vus < 0 || ouvert) vus = nMsg; document.getElementById('nbchat').textContent = nMsg > vus ? ' (' + (nMsg - vus) + ')' : '';
  });
}
function basculeChat(){ const c = document.getElementById('chat'), ouvre = c.style.display !== 'block'; c.style.display = ouvre ? 'block' : 'none'; if (ouvre) { vus = nMsg; document.getElementById('nbchat').textContent = ''; document.getElementById('ci').focus(); } }
function envoyerChat(){ const i = document.getElementById('ci'), t = i.value.trim(); if (!t) return; i.value = ''; db.ref('catan/chats/'+pid).push({ j:moi, t:t.slice(0, 200), ts:firebase.database.ServerValue.TIMESTAMP }); }

// ===== Mouton nommé, enregistrement, classement, historique =====
const esc = t => String(t).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function enregistrer(){ // partie terminée : enregistrée une seule fois dans l'historique (donc dans le classement)
  const joueurs = {}; G.ordre.forEach(j => joueurs[j] = P.places[j].couleur);
  db.ref('catan/historique/'+pid).transaction(c => c || { date:Date.now(), duree:Date.now() - P.debut, joueurs, vainqueur:G.vainqueur });
  db.ref('catan/parties/'+pid).update({ statut:'terminee' });
}
async function nommer(nom){ // le vainqueur nomme un mouton : il remplace une carte non nommée tirée au hasard (ou s'ajoute si toutes sont nommées)
  nom = nom.trim().slice(0, 30); await db.ref('catan/parties/'+pid).update({ moutonFait:true }); if (!nom) return;
  const date = new Date().toLocaleDateString('fr-FR');
  await db.ref('catan/moutons').transaction(d => { d = d || {}; const l = Object.keys(d).filter(k => !d[k].nom); d[l.length ? l[Math.floor(Math.random()*l.length)] : 'm'+Date.now()] = { nom, date }; return d; });
  db.ref('catan/historique/'+pid+'/mouton').set({ nom, date });
}
function archiver(n){ if (confirm('Archiver '+n+' ? Ses parties restent dans l\'historique et le classement.')) db.ref('catan/joueurs/'+n+'/archive').set(true).then(profils); }

async function stats(){
  if (ecoute) ecoute.off();
  const H = Object.values((await db.ref('catan/historique').get()).val() || {}), st = {};
  H.forEach(g => Object.keys(g.joueurs).forEach(n => { const x = st[n] = st[n] || { pj:0, v:0, cl:{}, mo:0 }; x.pj++; x.cl[g.joueurs[n]] = (x.cl[g.joueurs[n]]||0) + 1; if (g.vainqueur === n) { x.v++; if (g.mouton) x.mo++; } }));
  const mine = st[moi] || { pj:0, v:0, cl:{}, mo:0 }, fav = Object.entries(mine.cl).sort((a, b) => b[1] - a[1])[0];
  const moy = H.length ? Math.round(H.reduce((a, g) => a + g.duree, 0) / H.length / 60000) : 0, longue = H.length ? Math.round(Math.max(...H.map(g => g.duree)) / 60000) : 0;
  const duo = {}; H.forEach(g => { if (g.vainqueur) duo[g.vainqueur] = (duo[g.vainqueur]||0) + 1; });
  const roi = Object.entries(duo).sort((a, b) => b[1] - a[1])[0];
  html(`<div class="carte">${croix()}<h1>📊 Statistiques</h1>
    <p><b>Groupe</b> : ${H.length} partie(s) · durée moyenne ${moy} min · la plus longue ${longue} min${roi ? ' · le plus de victoires : 🏆 '+esc(roi[0])+' ('+roi[1]+')' : ''}</p>
    <p><b>${esc(moi)}</b> : ${mine.pj} partie(s) · ${mine.v} victoire(s) · ${mine.pj ? Math.round(100*mine.v/mine.pj) : 0} %${fav ? ' · couleur la plus jouée : <span class="pastille" style="background:'+COULEURS[fav[0]]+'"></span>'+esc(fav[0]) : ''} · 🐑 moutons nommés : ${mine.mo}</p>
    <button onclick="salon()">Retour</button></div>`);
}
function reglages(){
  if (ecoute) ecoute.off();
  html(`<div class="carte">${croix()}<h1>⚙️ Réglages</h1><p>Profil de cet appareil : <b>${esc(moi)}</b></p>
    <p><button onclick="choixAvatar()">🎭 Changer de personnage</button></p>
    <p><button onclick="profils()">👤 Changer de profil</button></p>
    <p><button onclick="regles()">📖 Règles</button></p>
    <p><button onclick="salon()">Retour</button></p></div>`);
}
let archives = false;
async function classement(){
  if (ecoute) ecoute.off();
  const H = (await db.ref('catan/historique').get()).val() || {}, J = (await db.ref('catan/joueurs').get()).val() || {}, st = {};
  [...C.JOUEURS, ...Object.keys(J)].forEach(n => st[n] = { n, pj:0, v:0 });
  Object.values(H).forEach(g => Object.keys(g.joueurs).forEach(n => { const x = st[n] = st[n] || { n, pj:0, v:0 }; x.pj++; if (g.vainqueur === n) x.v++; }));
  const l = Object.values(st).filter(x => archives || !(J[x.n] && J[x.n].archive)).map(x => ({ ...x, pts:x.pj + 3*x.v, pc:x.pj ? Math.round(100*x.v/x.pj) : 0 })).sort((a, b) => b.pts - a.pts || b.v - a.v || a.n.localeCompare(b.n));
  html(`<div class="carte">${croix()}<h1>🏆 Classement</h1><table style="border-collapse:collapse;margin:auto"><tr><th>#</th><th></th><th>Joueur</th><th>Parties</th><th>Vict.</th><th>%</th><th>Points</th></tr>
    ${l.map((x, i) => `<tr><td>${i+1}</td><td>${avatarSvg(J[x.n] && J[x.n].avatar, 26)}</td><td>${esc(x.n)}${J[x.n] && J[x.n].archive ? ' 🗄' : ''}</td><td>${x.pj}</td><td>${x.v}</td><td>${x.pc}%</td><td>${x.pts}</td></tr>`).join('')}</table>
    <p><label><input type="checkbox" ${archives?'checked':''} onchange="archives=this.checked;classement()"> Afficher les archivés</label></p><button onclick="salon()">Retour</button></div>`);
}
async function historique(){
  if (ecoute) ecoute.off();
  const H = (await db.ref('catan/historique').get()).val() || {}, ids = Object.keys(H).sort((a, b) => H[b].date - H[a].date);
  html(`<div class="carte" style="width:90vw">${croix()}<h1>📜 Historique</h1>${ids.map(i => { const g = H[i]; return `<p style="margin:6px 0;border-bottom:1px solid #fff4">${new Date(g.date).toLocaleDateString('fr-FR')} · ${Math.round(g.duree/60000)} min · 
    ${Object.entries(g.joueurs).map(([n, c]) => `<span class="pastille" style="background:${COULEURS[c]}"></span>${n === g.vainqueur ? '🏆' : ''}${esc(n)}`).join(' ')}
    ${g.mouton ? ' · 🐑 '+esc(g.mouton.nom) : ''} <button onclick="corriger('${i}')">✏️</button><button onclick="annuler('${i}')">❌</button></p>`; }).join('') || 'Aucune partie'}<button onclick="salon()">Retour</button></div>`);
}
async function annuler(i){ if (confirm('Annuler cette partie ? Elle ne comptera plus au classement.')) { await db.ref('catan/historique/'+i).remove(); historique(); } }
async function corriger(i){
  const g = (await db.ref('catan/historique/'+i).get()).val(), n = prompt('Nouveau vainqueur ?\n'+Object.keys(g.joueurs).join(', '), g.vainqueur);
  if (n && g.joueurs[n] && n !== g.vainqueur && confirm('Corriger le vainqueur : '+n+' ?')) { await db.ref('catan/historique/'+i+'/vainqueur').set(n); historique(); }
}

if (db) chargement(); else html('<div class="carte"><h1>Configurer config.js (Firebase)</h1></div>');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
